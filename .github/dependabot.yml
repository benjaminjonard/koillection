version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      symfony-major:
        patterns:
          - "symfony/*"
        update-types:
          - "major"
      twig-major:
        patterns:
          - "twig/*"
        update-types:
          - "major"
      composer-non-major:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/assets"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "@materializecss/materialize"
    groups:
      npm-non-major:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      gh-actions-non-major:
        update-types:
          - "minor"
          - "patch"
