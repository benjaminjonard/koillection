name: Build release image for Docker Hub
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Git tag / version to build (e.g. 1.4.1)'
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  release:
    types: [published]

env:
  VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  push_release_image:
    name: Build release image for Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          repository: benjaminjonard/koillection
          ref: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get base image digest
        id: base_image
        run: |
          name=$(grep -m1 '^FROM' Dockerfile | awk '{print $2}')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$name" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: docker.io/koillection/koillection,docker.io/koillection/koillection:latest,docker.io/koillection/koillection:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.base.name=${{ steps.base_image.outputs.name }}
            org.opencontainers.image.base.digest=${{ steps.base_image.outputs.digest }}
