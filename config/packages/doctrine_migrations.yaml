doctrine_migrations:
    migrations_paths:
        'App\Migrations\Mysql': '%kernel.project_dir%/migrations/Mysql'
        'App\Migrations\Postgresql': '%kernel.project_dir%/migrations/Postgresql'
    storage:
        table_storage:
            table_name: doctrine_migration_version
    factories:
        'Doctrine\Migrations\MigrationsRepository': 'App\Doctrine\Migrations\PlatformMigrationsRepositoryFactory'
        'Doctrine\Migrations\Metadata\Storage\MetadataStorage': 'App\Doctrine\Migrations\PlatformMetadataStorageFactory'
    check_database_platform: true
    enable_profiler: false
    transactional: true
