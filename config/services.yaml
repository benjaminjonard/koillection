parameters:
    release: '1.8.6'
    default_locale: 'en'
    container.dumper.inline_factories: true

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\:
        resource: '../src/*'
        exclude:
            - '../src/Entity/'
            - '../src/Model/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\Api\Controller\:
        resource: '../src/Api/Controller'
        tags: [ 'controller.service_arguments' ]

    League\CommonMark\Extension\GithubFlavoredMarkdownExtension:
        tags: [ 'twig.markdown.league_extension' ]

when@test:
    services:
        App\Tests\Factory\:
            resource: '../tests/Factory'
